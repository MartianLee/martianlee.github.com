# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # Safety net: a cold Playwright cache used to let the install step hang for
    # the full 6h runner limit. Fail fast instead so the issue is visible.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            # --immutable: fail instead of silently rewriting yarn.lock on the runner
            echo "command=install --immutable" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Restore cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        env:
          SKIP_CONTENTLAYER_BUILD: true
      - name: Run lint
        run: ${{ steps.detect-package-manager.outputs.manager }} lint
      - name: Check for mermaid diagrams
        id: check-mermaid
        run: |
          if grep -r '```mermaid' data/posts/ >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Get Playwright version
        if: steps.check-mermaid.outputs.found == 'true'
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        if: steps.check-mermaid.outputs.found == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium (for mermaid rendering)
        if: steps.check-mermaid.outputs.found == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        # Non-fatal: the Chromium download has been deterministically hanging
        # after reaching 100% on the runners. Mermaid SSR is optional — if the
        # browser can't be installed we skip it (see "Decide mermaid" below) and
        # still ship the site. Fail fast instead of burning the job timeout.
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2; do
            echo "::group::Playwright install attempt $attempt"
            if timeout 240 npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt stalled or failed; retrying in 5s..."
            sleep 5
          done
          echo "Playwright install did not succeed; mermaid SSR will be skipped"
      - name: Install Playwright deps only (cached browsers)
        if: steps.check-mermaid.outputs.found == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: timeout 240 npx playwright install-deps chromium
      - name: Decide mermaid rendering availability
        if: steps.check-mermaid.outputs.found == 'true'
        # Enable mermaid SSR only when a Chromium browser is actually present.
        # Otherwise disable rehype-mermaid for this build so contentlayer renders
        # the rest of the site cleanly (diagrams degrade to code blocks). The
        # SSR path auto-recovers once the browser cache repopulates.
        run: |
          if ls ~/.cache/ms-playwright/chromium-*/ >/dev/null 2>&1 \
            || ls ~/.cache/ms-playwright/chromium_headless_shell-*/ >/dev/null 2>&1; then
            echo "Chromium present: mermaid SSR enabled"
          else
            echo "Chromium missing: disabling mermaid SSR for this build"
            echo "DISABLE_REHYPE_MERMAID=true" >> "$GITHUB_ENV"
          fi
      - name: Run contentlayer build
        run: npx contentlayer2 build
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build --turbopack
      # `yarn build` runs this as postbuild, but this job calls `next build` directly,
      # so without this step feed.xml and the tag feeds never reach ./out.
      - name: Generate RSS feeds
        run: node ./scripts/postbuild.mjs
        env:
          NODE_OPTIONS: --experimental-strip-types --experimental-json-modules
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
