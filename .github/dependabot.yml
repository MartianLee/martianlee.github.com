version: 2
updates:
  # Security updates open on their own; this weekly run batches routine bumps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Keeps the SHA-pinned actions in deploy.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
